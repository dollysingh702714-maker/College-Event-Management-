<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | College Event Management System</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-container">

    <div class="login-left">
        <h1>College Event Management System</h1>
        <p>Manage college events, registrations, stalls, competitions and results in one place.</p>

        <div class="features">
            <p>✓ Event Management</p>
            <p>✓ Student Registration</p>
            <p>✓ Stall & Booking</p>
            <p>✓ Competition & Results</p>
        </div>
    </div>

    <div class="login-right">
        <h2>Welcome Back!</h2>
        <p class="subtitle">Login to continue</p>

        <form id="loginForm">

            <label for="role">Login As</label>
            <select id="role" required>
                <option value="">Select your role</option>
                <option value="admin">Admin</option>
                <option value="student">Student</option>
                <option value="volunteer">Volunteer</option>
            </select>

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>

            <p id="message" role="status"></p>

        </form>

        <p class="note">
            College Event Management System © 2026
        </p>
    </div>

</div>

<script src="login.js"></script>
</body>
</html>
